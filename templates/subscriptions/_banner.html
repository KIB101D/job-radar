{% load radar_ui %}<div id="new-banner"{% if oob %} hx-swap-oob="true"{% endif %}
     class="banner-slot"
     hx-get="{% url 'subscriptions:new_count' subscription.token %}?since={{ since_id }}"
     hx-trigger="every 60s[document.visibilityState === 'visible']"
     hx-swap="outerHTML">
  {% if count %}
    <button class="banner" type="button"
            hx-get="{% url 'subscriptions:results' subscription.token %}"
            hx-target="#results" hx-swap="outerHTML show:#results:top">
      <span class="banner-pulse" aria-hidden="true"></span>
      {{ count }} {{ count|uk_plural:"нова вакансія,нові вакансії,нових вакансій" }}, показати
    </button>
  {% endif %}
</div>
