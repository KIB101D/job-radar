{% load l10n %}{% localize off %}<svg class="scope" viewBox="0 0 200 200" role="img" aria-label="{{ label }}">
  <circle class="scope-face" cx="100" cy="100" r="96"/>
  <circle class="scope-ring" cx="100" cy="100" r="88"/>
  <circle class="scope-ring" cx="100" cy="100" r="60"/>
  <circle class="scope-ring" cx="100" cy="100" r="32"/>
  <path class="scope-axis" d="M100 4 V196 M4 100 H196"/>
  <g class="scope-sweep">
    <path class="scope-wedge" d="M100 100 L100 4 A96 96 0 0 1 167.9 32.1 Z"/>
    <path class="scope-beam" d="M100 100 L100 4"/>
  </g>
  {% for b in blips %}
    <circle class="scope-blip{% if b.fresh %} is-fresh{% endif %}" cx="{{ b.x }}" cy="{{ b.y }}" r="{% if b.fresh %}4{% else %}3{% endif %}" style="animation-delay: -{{ b.delay }}s"/>
  {% endfor %}
  <circle class="scope-center" cx="100" cy="100" r="3"/>
</svg>{% endlocalize %}
