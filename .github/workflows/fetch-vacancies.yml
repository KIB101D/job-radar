name: Fetch vacancies

on:
  schedule:
    - cron: "7,37 * * * *"  # every 30 min (UTC), off the busy top of the hour
  workflow_dispatch:

concurrency:
  group: fetch-vacancies
  cancel-in-progress: false

jobs:
  fetch:
    uses: ./.github/workflows/_manage.yml
    with:
      command: fetch_vacancies
    secrets: inherit
