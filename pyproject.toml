[project]
name = "job-radar"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime dependencies, the same pins as requirements.txt (tests/test_project.py
# keeps them in sync): Vercel installs from here, CI and local setup from the
# requirements files.
dependencies = [
    "Django==5.2.18",
    "django-environ==0.14.0",
    "dj-database-url==3.1.2",
    "httpx==0.28.1",
    "feedparser==6.0.14",
    "beautifulsoup4==4.15.0",
    "psycopg[binary]==3.3.6",
    "whitenoise==6.12.0",
    "segno==1.6.6",
]

# Vercel: the Django app is one Python function (config/wsgi.py); collectstatic
# runs automatically, the rest of the build is bin/vercel_build.py.
[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python bin/vercel_build.py"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
